# Whole-repo PR check (Cloud Build trigger `repo-ci-<env>`, cloudbuild.tf).
# The per-app yamls validate + deploy one service each; this one is the
# required status check that runs EVERY suite on every PR, so a change in a
# shared package can't break a service whose path filter didn't fire.
#   gcloud builds submit --config infra/cloudbuild/ci.yaml .

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  env:
    - COREPACK_HOME=/workspace/.corepack
    - CI=true

timeout: 1800s

steps:
  - id: node
    name: node:22-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        corepack enable
        pnpm install --frozen-lockfile
        pnpm turbo run build type-check lint --ui=stream
        pnpm turbo run test --ui=stream --concurrency=2 --filter='!@vayusetu/ingestion-jobs' --filter='!@vayusetu/ml' --filter='!@vayusetu/firestore-rules'

  - id: python-ingestion
    name: python:3.12-slim
    waitFor: ['-']
    dir: apps/ingestion-jobs
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet -r requirements-dev.txt
        python -m pytest -q

  - id: python-ml
    name: python:3.11-slim
    waitFor: ['-']
    dir: ml
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet -r requirements-dev.txt
        python -m pytest -q   # includes compiling both Vertex AI pipelines offline

  - id: terraform
    name: hashicorp/terraform:1.9
    waitFor: ['-']
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        terraform fmt -check -recursive infra/terraform
        cd infra/terraform/modules/state-deployment
        terraform init -backend=false -input=false
        terraform validate
        terraform test

  # Firestore security rules against the real emulator (needs a JRE).
  - id: firestore-rules
    name: node:22
    waitFor: ['-']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq openjdk-17-jre-headless > /dev/null
        corepack enable
        pnpm install --frozen-lockfile --filter @vayusetu/firestore-rules
        pnpm --filter @vayusetu/firestore-rules test

  # Browser E2E for both frontends against their MSW mock modes (no backend).
  - id: e2e
    name: mcr.microsoft.com/playwright:v1.63.0-jammy
    waitFor: ['-']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        corepack enable
        pnpm install --frozen-lockfile --filter @vayusetu/e2e --filter @vayusetu/citizen-pwa... --filter @vayusetu/admin-dashboard...
        pnpm --filter @vayusetu/shared-types build
        pnpm --filter @vayusetu/e2e e2e
