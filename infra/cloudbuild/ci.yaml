# Whole-repo PR check (Cloud Build trigger `repo-ci-<env>`, cloudbuild.tf).
# The per-app yamls validate + deploy one service each; this one is the
# required status check that runs EVERY suite on every PR, so a change in a
# shared package can't break a service whose path filter didn't fire.
#   gcloud builds submit --config infra/cloudbuild/ci.yaml .

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  env:
    - COREPACK_HOME=/workspace/.corepack
    - CI=true

timeout: 1800s

steps:
  - id: node
    name: node:22-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        corepack enable
        pnpm install --frozen-lockfile
        pnpm turbo run build type-check lint --ui=stream
        pnpm turbo run test --ui=stream --concurrency=2 --filter='!@vayusetu/ingestion-jobs'

  - id: python
    name: python:3.12-slim
    waitFor: ['-']
    dir: apps/ingestion-jobs
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet -r requirements-dev.txt
        python -m pytest -q

  - id: terraform
    name: hashicorp/terraform:1.9
    waitFor: ['-']
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        terraform fmt -check -recursive infra/terraform
        cd infra/terraform/modules/state-deployment
        terraform init -backend=false -input=false
        terraform validate
        terraform test
